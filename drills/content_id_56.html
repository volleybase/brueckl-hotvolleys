<div class="container"><div class="text"><h1>Thema</h1>
<p><strong>Die Landung nicht vergessen</strong></p>
<h1>Beschreibung</h1>
<ul>
<li>Nachdem Sprung weich landen.</li>
<li>Nachfedern.</li>
<li>Dann in die Position laufen.</li>
</ul>
<h1>Hinweise</h1>
<ul>
<li>Eine weiche Landung hilft dem Rücken.</li>
</ul>
<h1>Variationen</h1>
<ul>
<li>Mehrmaliges bewusstes Nachfedern verlangen.</li>
</ul>
</div></div>
